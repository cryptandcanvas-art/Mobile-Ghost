name: Android APK and lint
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check defense policy
        run: |
          mkdir -p build/policy-check
          javac -d build/policy-check app/src/main/java/app/sovereign/phone/DefenseMatrix.java checks/DefenseMatrixCheck.java
          java -cp build/policy-check DefenseMatrixCheck
      - name: Assemble and lint
        run: bash gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mobile-ghost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

